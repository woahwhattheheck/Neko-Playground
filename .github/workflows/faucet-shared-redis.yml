name: Faucet shared Redis acceptance

on:
  push:
    branches: ["test/neko327-shared-redis-cedar834c"]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7.2.5-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: isolated-neko-acceptance
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: isolated-neko-acceptance
      PRODUCT_SOURCE_REVISION: 848d0faec281bea69411cef965f97b36acf8186d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Install only the actual client and TypeScript loader
        run: |
          mkdir -p .ci-neko-deps artifacts/faucet-shared-redis
          node -e 'require("fs").writeFileSync(".ci-neko-deps/package.json", JSON.stringify({private:true,dependencies:{"@upstash/redis":"1.39.0",typescript:"5.8.3"}}))'
          npm install --prefix .ci-neko-deps --ignore-scripts --no-audit --no-fund
          npm list --prefix .ci-neko-deps --json > artifacts/faucet-shared-redis/dependencies.json
      - name: Verify the unchanged product and record image identities
        run: |
          git diff --exit-code "$PRODUCT_SOURCE_REVISION" HEAD -- apps/web-app/src/lib/faucetRateLimit.ts apps/web-app/src/lib/constants/faucet.ts apps/web-app/src/app/api/faucet/route.ts apps/web-app/src/lib/faucetSubmission.ts
          docker image inspect redis:7.2.5-alpine hiett/serverless-redis-http:latest > artifacts/faucet-shared-redis/images.json
          git rev-parse HEAD > artifacts/faucet-shared-redis/controller.txt
      - name: Run only the required shared-store acceptance
        run: |
          export NODE_PATH="$GITHUB_WORKSPACE/.ci-neko-deps/node_modules"
          node --experimental-strip-types scripts/validation/faucet-shared-redis/acceptance.cts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faucet-shared-redis-cedar834c
          path: artifacts/faucet-shared-redis
          retention-days: 14
